<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Chat</h1>
      <button class="btn-clear" id="btnClear" title="Smazat historii">Smazat historii</button>
    </header>

    <main class="chat-history" id="chatHistory">
      <p class="empty-state" id="emptyState">Zatím žádné zprávy. Začněte psát...</p>
    </main>

    <footer class="input-bar">
      <div class="input-wrap">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="Napište zprávu..."
          rows="1"
          maxlength="2000"
        ></textarea>
        <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
      </div>
      <button class="btn-mic" id="btnMic" title="Hlasový vstup (brzy)" aria-label="Hlasový vstup">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="btn-send" id="btnSend" title="Odeslat" aria-label="Odeslat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
